[package]
name = "ember"
version = "0.1.1"
edition = "2024"
description = "Open-source f.lux alternative with per-game rules"
license = "MIT"
repository = "https://github.com/fredagsguf/Ember"
keywords = ["flux", "night-light", "blue-light", "gamma", "redshift"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
env_logger = "0.11.11"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.1"
toml = "1.1.8"
toml_edit = "0.25.17"

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_ColorSystem", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
rustix = { version = "1.1.6", features = ["fs"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["randr"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = true
strip = true

[build-dependencies]
winresource = "0.1.34"

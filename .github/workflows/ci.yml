name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Pushes the UI screenshots to the ci-screenshots branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ember-windows
          path: target/release/ember.exe

      - name: Software OpenGL for the settings window
        # The runner has no GPU, and Windows' own OpenGL 1.1 is too old for egui. Mesa's
        # llvmpipe next to ember.exe (for this check only; it's not in the artifact) fills in.
        shell: pwsh
        run: |
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          Invoke-WebRequest $url -OutFile mesa.7z
          $hash = (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          if ($hash -ne '351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695') {
            throw "unexpected Mesa download: $hash"
          }
          7z x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa/x64/*.dll target/release/
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV

      - name: UI check (settings screenshots, title and fullscreen rules)
        shell: pwsh
        run: .github/scripts/windows-ui-check.ps1 -Exe target/release/ember.exe -Out ui-check

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          [ -d ui-check ] || exit 0
          cd ui-check
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# UI check for %s\n\nBranch %s, run %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > README.md
          git add -A
          git commit -q -m "UI check for $GITHUB_SHA ($GITHUB_REF_NAME)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" ci-screenshots

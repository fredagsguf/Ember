name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build Ember for Windows and
# Linux and publish both as one GitHub Release. Running it manually builds the packages as
# workflow artifacts without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $crate = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'ember'
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$($crate.version)" -and -not $tag.StartsWith("v$($crate.version)-")) {
              throw "Tag $tag does not match Cargo.toml version $($crate.version). Bump Cargo.toml first."
            }
            $label = $tag
          } else {
            $label = "v$($crate.version)-dev.$("${{ github.sha }}".Substring(0, 7))"
          }
          "name=ember-$label-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release

      - name: Build
        # Static CRT: ember.exe doesn't need the Visual C++ redistributable installed.
        # Explicit --target keeps the flag off build scripts and proc-macros.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --bins --target ${{ env.TARGET }}

      - name: Smoke test
        shell: pwsh
        run: |
          $bin = "target/${{ env.TARGET }}/release"
          # ember.exe is a GUI-subsystem app: PowerShell neither waits for it nor captures its
          # output unless it's started like this.
          $p = Start-Process "$bin/ember.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput version.txt
          $version = Get-Content version.txt -Raw
          Write-Host $version
          if ($p.ExitCode -ne 0 -or $version -notmatch '^ember ') { throw "ember.exe --version failed" }
          # No VC++ runtime DLL dependency (static CRT).
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          if ($dumpbin) {
            $deps = & $dumpbin.FullName /dependents "$bin/ember.exe" | Out-String
            Write-Host $deps
            if ($deps -match 'VCRUNTIME|MSVCP') { throw "ember.exe depends on the VC++ runtime" }
          }

      - name: Package
        shell: pwsh
        run: |
          $name = "${{ steps.version.outputs.name }}"
          $bin = "target/${{ env.TARGET }}/release"
          # Just the exe: the default config and the license are built into it.
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "$bin/ember.exe" -Destination "dist/$name.exe"
          $hash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Out-File -Encoding ascii "dist/$name.exe.sha256"
          Get-Content "dist/$name.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            dist/*.exe
            dist/*.sha256

  linux:
    # The oldest supported runner, so the binary runs on any distro with glibc 2.35 or newer
    # (Ubuntu 22.04+, Debian 12+, Fedora 36+, current Arch...).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Work out version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "ember") | .version')
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"
            case "$tag" in
              "v$version" | "v$version-"*) ;;
              *) echo "Tag $tag does not match Cargo.toml version $version. Bump Cargo.toml first." >&2; exit 1 ;;
            esac
            label=$tag
          else
            label="v$version-dev.${GITHUB_SHA::7}"
          fi
          echo "name=ember-$label-linux-x64" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release --bins

      - name: Smoke test
        run: |
          ./target/release/ember --version | grep '^ember '
          ldd target/release/ember

      - name: Package
        run: |
          name="${{ steps.version.outputs.name }}"
          mkdir -p "dist/$name"
          cp target/release/ember README.md LICENSE config.example.toml contrib/ember.desktop "dist/$name/"
          cp docs/logo.png "dist/$name/ember.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" && cat "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          win="ember-$tag-windows-x64.exe"
          linux="ember-$tag-linux-x64.tar.gz"
          cat > notes.md <<EOF
          ## Windows 10/11

          1. Download \`$win\` below and put it somewhere it can stay (e.g. \`%LOCALAPPDATA%\Programs\Ember\`).
          2. Run it. Ember appears in the system tray: click it for settings, right-click for the menu.
          3. Optional: tick **Start with Windows** in the tray menu.

          **Updating:** quit Ember and run the new download. *Start with Windows* switches to it.

          **"Windows protected your PC"**: ember.exe isn't code-signed yet, so SmartScreen warns
          on first launch. Click *More info* → *Run anyway*.

          **Warm colours stop at ~4000K?** Pick *Allow warmer colours…* in the tray menu (it asks
          for admin rights once), then sign out and back in.

          ## Linux (x86-64)

          \`\`\`bash
          tar -xzf $linux
          cd ${linux%.tar.gz}
          install -Dm755 ember ~/.local/bin/ember
          install -Dm644 ember.desktop ~/.local/share/applications/ember.desktop
          install -Dm644 ember.png ~/.local/share/icons/hicolor/512x512/apps/ember.png
          ember
          \`\`\`

          Needs a desktop with a system tray (StatusNotifierItem). See the README for which desktops are supported.

          Check a download with the \`.sha256\` file next to it (\`sha256sum -c\` on Linux, \`Get-FileHash\` on Windows).
          EOF

          files=(dist/*)
          if gh release view "$tag" > /dev/null 2>&1; then
            # Re-run of the workflow for an existing release: replace the assets.
            gh release upload "$tag" "${files[@]}" --clobber
          else
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "${files[@]}" --verify-tag --title "Ember $tag" \
              --notes-file notes.md --generate-notes "${flags[@]}"
          fi
